name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "sql/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spainelectoralpollsdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/spainelectoralpollsdb_test
      API_ENV: test
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:3000
      ENABLE_ADMIN_ENDPOINTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: api
        run: ruff check .
      - name: Test
        working-directory: api
        run: pytest
      - name: Build Docker image
        run: docker build -t spain-electoral-polls-api:ci ./api

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
      REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
      API_ENV_FILE_PATH: ${{ secrets.API_ENV_FILE_PATH }}
      REMOTE_DOCKER_NETWORK: ${{ vars.REMOTE_DOCKER_NETWORK || secrets.REMOTE_DOCKER_NETWORK }}
      API_CONTAINER_NAME: ${{ vars.API_CONTAINER_NAME || secrets.API_CONTAINER_NAME || 'spain-electoral-polls-api' }}
      API_IMAGE_NAME: ${{ vars.API_IMAGE_NAME || secrets.API_IMAGE_NAME || 'spain-electoral-polls-api:latest' }}
      API_PORT: ${{ vars.API_PORT || secrets.API_PORT || '8010' }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.REMOTE_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts
      - name: Deploy on remote host
        run: |
          remote_env=(
            "REMOTE_APP_DIR=$(printf '%q' "$REMOTE_APP_DIR")"
            "API_ENV_FILE_PATH=$(printf '%q' "$API_ENV_FILE_PATH")"
            "REMOTE_DOCKER_NETWORK=$(printf '%q' "$REMOTE_DOCKER_NETWORK")"
            "API_CONTAINER_NAME=$(printf '%q' "$API_CONTAINER_NAME")"
            "API_IMAGE_NAME=$(printf '%q' "$API_IMAGE_NAME")"
            "API_PORT=$(printf '%q' "$API_PORT")"
          )

          ssh -i ~/.ssh/deploy_key -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "${remote_env[*]} bash -s" <<'REMOTE'
          set -euo pipefail

          API_ENV_FILE_PATH="$(printf '%s' "$API_ENV_FILE_PATH" | tr -d '\r' | xargs)"

          cd "$REMOTE_APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          if [ ! -f "$API_ENV_FILE_PATH" ]; then
            echo "API env file not found on remote host. Check API_ENV_FILE_PATH."
            echo "Remote user: $(whoami)"
            echo "Remote cwd: $(pwd)"
            echo "Expected env file directory exists: $(test -d "$(dirname "$API_ENV_FILE_PATH")" && echo yes || echo no)"
            exit 1
          fi

          docker build -t "$API_IMAGE_NAME" ./api
          docker stop "$API_CONTAINER_NAME" || true
          docker rm "$API_CONTAINER_NAME" || true

          if command -v ss >/dev/null 2>&1 && ss -ltn "( sport = :$API_PORT )" | grep -q ":$API_PORT"; then
            echo "Port $API_PORT is already in use on the remote host."
            echo "Free the port or set the API_PORT repository variable to another host port."
            ss -ltnp "( sport = :$API_PORT )" || true
            exit 1
          fi

          docker_args=(
            -d
            --name "$API_CONTAINER_NAME"
            --restart unless-stopped
            --env-file "$API_ENV_FILE_PATH"
            --add-host host.docker.internal:host-gateway
            -p "127.0.0.1:$API_PORT:8000"
          )

          if [ -n "${REMOTE_DOCKER_NETWORK:-}" ]; then
            docker_args+=(--network "$REMOTE_DOCKER_NETWORK")
          fi

          docker run "${docker_args[@]}" "$API_IMAGE_NAME"

          for attempt in $(seq 1 20); do
            if curl -fsS "http://localhost:$API_PORT/health"; then
              exit 0
            fi
            echo "Waiting for API healthcheck... attempt $attempt/20"
            sleep 2
          done

          echo "API healthcheck failed. Container status:"
          docker ps -a --filter "name=$API_CONTAINER_NAME"
          echo "Container logs:"
          docker logs "$API_CONTAINER_NAME" || true
          exit 1
          REMOTE
