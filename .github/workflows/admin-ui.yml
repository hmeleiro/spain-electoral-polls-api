name: Admin UI CI/CD

on:
  pull_request:
    paths:
      - "api/admin-ui/**"
      - ".github/workflows/admin-ui.yml"

  push:
    branches:
      - main
    paths:
      - "api/admin-ui/**"
      - ".github/workflows/admin-ui.yml"

  workflow_dispatch:

jobs:
  build:
    name: Build admin-ui
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api/admin-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin-ui
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: api/admin-ui/dist

  deploy:
    name: Deploy admin-ui
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
      REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
      ADMIN_UI_REMOTE_DIR: ${{ vars.ADMIN_UI_REMOTE_DIR || secrets.ADMIN_UI_REMOTE_DIR }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-ui-dist
          path: dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.REMOTE_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to remote server
        run: |
          remote_dir="${ADMIN_UI_REMOTE_DIR:-$REMOTE_APP_DIR/api/admin-ui/dist}"
          ssh -i ~/.ssh/deploy_key -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "mkdir -p '$remote_dir'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $REMOTE_PORT" dist/ "$REMOTE_USER@$REMOTE_HOST:$remote_dir/"
